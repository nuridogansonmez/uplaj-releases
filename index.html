<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uplaj panel</title>
<style>
  :root { --bg:#0d0f13; --panel:#161920; --panel2:#1d212a; --line:#272c38; --text:#e7e9ef; --dim:#8b93a7; --ok:#3ecf8e; --warn:#f5a524; --bad:#f2555a; --acc:#5b8cff; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; display:flex; flex-direction:column; overflow:hidden; }
  header { display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel); flex:none; }
  header b { font-size:15px; margin-right:6px; letter-spacing:.02em; }
  .sp { flex:1; }
  input, button, select { background:#0b0d11; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 9px; font:inherit; }
  button { cursor:pointer; white-space:nowrap; } button:hover { border-color:#3a4152; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  label.chk { display:flex; gap:5px; align-items:center; color:var(--dim); }
  #hint { color:var(--dim); font-size:12px; padding:4px 12px; border-bottom:1px solid var(--line); flex:none; }
  #hint kbd { background:var(--panel2); border:1px solid var(--line); border-radius:4px; padding:0 4px; font:11px ui-monospace, Menlo, monospace; }

  #grid { flex:1; min-height:0; display:grid; gap:8px; padding:8px; grid-template-columns:repeat(auto-fit, minmax(340px, 1fr)); grid-auto-rows:minmax(0, 1fr); overflow:auto; }
  body.solo #grid { grid-template-columns: 1fr 240px; grid-template-rows: repeat(var(--srows, 6), minmax(0,1fr)); }
  body.solo .tile:not(.active) { min-height:0; }
  .slot { display:none; }
  /* Büyüt modunda sağdaki küçükler: sadece isim + ms (butonlar/ayrıntılar büyükte) */
  body.solo .tile:not(.active) .bar .pill:not(.p-rtt), body.solo .tile:not(.active) .bar button { display:none !important; }
  body.solo .tile:not(.active) .bar { cursor:pointer; }
  /* Sekmeli görünüm */
  #tabbar { display:none; gap:4px; padding:6px 8px 0; flex:none; overflow-x:auto; border-bottom:1px solid var(--line); }
  body.tabs #tabbar { display:flex; }
  #tabbar button { border-bottom-left-radius:0; border-bottom-right-radius:0; border-bottom:none; display:flex; gap:6px; align-items:center; padding:6px 12px; }
  #tabbar button.on { background:var(--panel2); border-color:var(--acc); color:#fff; }
  #tabbar .ms { font:11px ui-monospace, Menlo, monospace; color:var(--dim); }
  #tabbar .ms.bad { color:var(--bad); } #tabbar .ms.warn { color:var(--warn); } #tabbar .ms.ok { color:var(--ok); }
  body.tabs #grid { grid-template-columns:1fr; grid-template-rows:minmax(0,1fr); grid-auto-rows:0; }
  body.tabs .tile:not(.active) { display:none; }
  body.tabs #solo, body.tabs #pager { display:none !important; }
  body.solo .slot { display:flex; align-items:center; justify-content:center; border:2px dashed var(--acc); border-radius:8px; color:var(--dim); font-size:12px; text-align:center; padding:4px; }
  @media (max-width: 800px) { body.solo #grid { grid-template-columns:1fr; grid-template-rows:auto; } body.solo .tile:not(.active){ display:none; } }

  .tile { position:relative; background:#000; border:2px solid var(--line); border-radius:8px; overflow:hidden; min-height:160px; display:flex; flex-direction:column; }
  .tile.active { border-color:var(--acc); }
  .tile.capture { border-color:var(--ok); box-shadow:0 0 0 1px var(--ok) inset; }
  .tile video { width:100%; flex:1; min-height:0; object-fit:contain; background:#000; display:block; outline:none; }
  .tile.capture video { cursor:none; }
  .tile.capture.showcursor video { cursor:crosshair; }
  /* Üst şerit görüntünün DIŞINDA: oyun ekranını kapatmaz, her zaman tıklanır */
  .bar { order:-1; flex:none; display:flex; gap:5px; align-items:center; flex-wrap:nowrap; overflow:hidden; padding:3px 6px; min-height:28px; background:var(--panel2); border-bottom:1px solid var(--line); }
  .bar .pill { display:none; }
  .bar .p-rtt, .bar .pill.bad, .bar .p-own.warn, .bar .p-esp.warn { display:inline-block; }
  .bar:hover .pill { display:inline-block; }
  .bar .name { font-weight:600; margin-right:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .bar button { padding:1px 7px; font-size:12px; background:#0b0d11; flex:none; }
  .pill { padding:1px 7px; border-radius:999px; font-size:11px; border:1px solid #fff3; color:#ccd; background:#0008; }
  .pill.ok { color:var(--ok); border-color:#3ecf8e88; } .pill.bad { color:var(--bad); border-color:#f2555a88; } .pill.warn { color:var(--warn); border-color:#f5a52488; }
  .center { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; color:var(--dim); pointer-events:none; padding:20px; }
  .num { position:absolute; right:7px; bottom:5px; font:600 12px ui-monospace, Menlo, monospace; color:#fff8; pointer-events:none; }

  dialog { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:16px; width:min(420px, 92vw); }
  dialog::backdrop { background:#0009; }
  dialog h3 { margin:0 0 10px; }
  dialog label { display:block; color:var(--dim); margin:8px 0 3px; }
  dialog input { width:100%; }
  dialog .row { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  body.fixed:not(.solo) #grid { grid-template-columns:repeat(var(--cols), minmax(0,1fr)); grid-template-rows:repeat(var(--rows), minmax(0,1fr)); grid-auto-rows:0; overflow:hidden; }
  .tile.off { display:none; }
  #pager { display:none; gap:4px; align-items:center; color:var(--dim); }
  body.fixed:not(.solo) #pager.many { display:flex; }
  .otpmenu { position:absolute; top:34px; right:8px; z-index:5; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px; min-width:220px; box-shadow:0 6px 20px #0008; }
  .otpmenu button { display:block; width:100%; text-align:left; margin:2px 0; }
  .otpmenu .hint { color:var(--dim); font-size:11px; padding:4px 2px; }
  .charrow { display:grid; grid-template-columns: 1fr 1fr 1.4fr auto; gap:4px; margin-top:4px; }
  .charrow input { width:100%; min-width:0; font-size:12px; }
  .charhead { display:grid; grid-template-columns: 1fr 1fr 1.4fr 28px; gap:4px; color:var(--dim); font-size:11px; margin-top:4px; }
  dialog { width:min(560px, 94vw); }
  dialog textarea { width:100%; min-height:70px; background:#0b0d11; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 9px; font:12px ui-monospace, Menlo, monospace; }
  #empty { grid-column:1/-1; align-self:center; justify-self:center; color:var(--dim); text-align:center; max-width:460px; }
</style>
</head>
<body>
<header>
  <b>uplaj</b>
  <input id="user" placeholder="adın" size="9" title="Diğer kişiler kontrolün kimde olduğunu bu isimle görür">
  <button id="add" class="primary">+ Makine</button>
  <button id="takeAll">Hepsini al</button>
  <button id="releaseAll">Hepsini bırak</button>
  <span class="sp"></span>
  <select id="mode" title="Fare modu"><option value="abs">Fare: ekrandaki nokta</option><option value="rel">Fare: kilitli (kamera)</option></select>
  <label class="chk"><input type="checkbox" id="cmdctrl"> Cmd = Ctrl</label>
  <select id="layout" title="Ekranda kaç makine görünsün">
    <option value="auto">Düzen: otomatik</option><option value="tabs">Sekmeli (üstte sekmeler)</option><option value="1">1'li</option><option value="2">2'li</option>
    <option value="4">4'lü</option><option value="6">6'lı</option><option value="8">8'li</option><option value="9">9'lu</option>
  </select>
  <span id="pager"><button id="pgPrev">‹</button><span id="pgText"></span><button id="pgNext">›</button></span>
  <button id="solo" title="Seçili makineyi büyüt / grid'e dön">Büyüt</button>
  <button id="share" title="Makine listesini ortağına göndermek için kopyala / yapıştır">Liste</button>
  <button id="upd" title="İnternetteki son sürümü bütün makinelere kur (Shift+tık: exe dosyası seç)">Güncelle</button>
  <input type="file" id="updFile" accept=".exe" hidden>
</header>
<div id="hint">
  Makineye <b>tıkla</b>: seçilir ve kontrol başlar (yeşil çerçeve). <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>1–9</kbd>: makine değiştir ·
  <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>0</kbd>: kontrolü bırak (klavye serbest) · Kilitli fare modunda çıkmak için <kbd>Esc</kbd>
</div>
<nav id="tabbar"></nav>
<main id="grid"></main>

<dialog id="dlg">
  <h3 id="dlgTitle">Makine ekle</h3>
  <label>İsim</label><input id="fName" placeholder="kvm1">
  <label>Adres</label><input id="fUrl" placeholder="http://10.10.10.181:8780 veya https://kvm1.alanadi.com">
  <label>Erişim kodu</label><input id="fToken" placeholder="uplaj-agent penceresinde yazar">
  <label>Karakterler (isteğe bağlı) — OTP menüsünden yazdırılır</label>
  <div id="fChars"></div>
  <button id="fAddChar" type="button" style="margin-top:6px">+ Karakter ekle</button>
  <label>Ortak oyun şifresi (bütün karakterler için; sadece bu tarayıcıda saklanır, Liste koduna girmez)</label>
  <div style="display:flex;gap:6px"><input id="fPass" type="password" autocomplete="off" placeholder="boş bırakırsan giriş butonu şifre yazmaz"><button type="button" id="fPassShow">Göster</button></div>
  <label>OTP sitesi adresi (bütün makineler için aynı)</label><input id="fOtpUrl" placeholder="https://...">
  <div class="row"><button id="fDel" style="margin-right:auto;color:var(--bad)">Sil</button><button id="fCancel">Vazgeç</button><button id="fSave" class="primary">Kaydet</button></div>
</dialog>

<script>
"use strict";
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// ---------- HID tuş kodları (KeyboardEvent.code -> USB HID usage)
const HID = {};
"abcdefghijklmnopqrstuvwxyz".split("").forEach((c,i)=> HID["Key"+c.toUpperCase()] = 0x04+i);
"1234567890".split("").forEach((c,i)=> HID["Digit"+c] = 0x1E+i);
for (let i=1;i<=12;i++) HID["F"+i] = 0x39+i;
for (let i=1;i<=9;i++) HID["Numpad"+i] = 0x58+i;
Object.assign(HID, {
  Enter:0x28, Escape:0x29, Backspace:0x2A, Tab:0x2B, Space:0x2C, Minus:0x2D, Equal:0x2E,
  BracketLeft:0x2F, BracketRight:0x30, Backslash:0x31, Semicolon:0x33, Quote:0x34, Backquote:0x35,
  Comma:0x36, Period:0x37, Slash:0x38, CapsLock:0x39, PrintScreen:0x46, ScrollLock:0x47, Pause:0x48,
  Insert:0x49, Home:0x4A, PageUp:0x4B, Delete:0x4C, End:0x4D, PageDown:0x4E,
  ArrowRight:0x4F, ArrowLeft:0x50, ArrowDown:0x51, ArrowUp:0x52, NumLock:0x53,
  NumpadDivide:0x54, NumpadMultiply:0x55, NumpadSubtract:0x56, NumpadAdd:0x57, NumpadEnter:0x58,
  Numpad0:0x62, NumpadDecimal:0x63, IntlBackslash:0x64, ContextMenu:0x65,
  ControlLeft:0xE0, ShiftLeft:0xE1, AltLeft:0xE2, ControlRight:0xE4, ShiftRight:0xE5, AltRight:0xE6,
});
const u16 = v => { v &= 0xFFFF; return [v & 0xFF, v >> 8]; };

// ---------- Ayarlar
let machines = store.get("uplaj.machines", []);
$("user").value = store.get("uplaj.user", "");
$("mode").value = store.get("uplaj.mode", "abs");
$("cmdctrl").checked = store.get("uplaj.cmdctrl", false);
const me = () => $("user").value.trim() || "isimsiz";
$("user").onchange = () => { store.set("uplaj.user", $("user").value.trim()); conns.forEach(c => c.reconnect()); };
$("mode").onchange = () => { store.set("uplaj.mode", $("mode").value); stopCapture(); };
$("cmdctrl").onchange = () => store.set("uplaj.cmdctrl", $("cmdctrl").checked);
const saveMachines = () => store.set("uplaj.machines", machines.map(({id,name,url,token,otp}) => ({id,name,url,token,otp: otp || ""})));
// "Karakter = seed" satırlarını ayır
// Satır biçimi:  Karakter | hesapID | seed   (eski biçim de olur: Karakter = seed)
const parseOtp = txt => String(txt || "").split(/\n/).map(l => l.trim()).filter(Boolean).map(l => {
  if (l.includes("|")) {
    const [name, id, seed] = l.split("|").map(x => (x || "").trim());
    return { name: name || "karakter", id: id || "", seed: seed || "" };
  }
  const i = l.search(/[=:]/);
  if (i > 0) return { name: l.slice(0, i).trim(), id: "", seed: l.slice(i + 1).trim() };
  const w = l.split(/[\s,;¦]+/).filter(Boolean); // "Okcu hesabim 5dbe..." gibi boşlukla yazılmışsa
  if (w.length === 3) return { name: w[0], id: w[1], seed: w[2] };
  if (w.length === 2) return /^[0-9a-f]{16,}$/i.test(w[1]) ? { name: w[0], id: "", seed: w[1] } : { name: w[0], id: w[1], seed: "" };
  return { name: "seed", id: "", seed: l };
}).filter(x => x.seed || x.id);
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; }
  catch { const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); const ok = document.execCommand("copy"); a.remove(); return ok; }
}
function otpMenu(c){
  stopCapture();
  const old = c.tile.querySelector(".otpmenu"); if (old) { old.remove(); return; }
  document.querySelectorAll(".otpmenu").forEach(x => x.remove());
  const list = parseOtp(c.m.otp), url = store.get("uplaj.otpUrl", "");
  const box = document.createElement("div"); box.className = "otpmenu";
  box.addEventListener("mousedown", e => e.stopPropagation());
  const close = (el, msg) => { el.textContent = msg; setTimeout(() => box.remove(), 1000); };
  const add = (label, title, fn) => { const b = document.createElement("button"); b.textContent = label; b.title = title; b.onclick = () => fn(b); box.appendChild(b); };
  if (!list.length) box.innerHTML = `<div class="hint">Bu makineye karakter eklenmemiş. ⚙ (Düzenle) → "+ Karakter ekle" ile karakter adı, hesap ID'si ve seed'i gir.</div>`;
  list.forEach(x => {
    const h = document.createElement("div"); h.className = "hint"; h.style.cssText = "color:var(--text);font-weight:600;padding-top:6px";
    h.textContent = x.name; box.appendChild(h);
    if (x.id) add("🔑 Giriş yap (ID + şifre + Enter, 1 sn sonra Enter)", "Oyunda ID kutusuna tıkla, sonra bunu seç", b => {
      const pass = store.get("uplaj.pass", "");
      if (!pass) { close(b, "⚠ ortak şifre girilmemiş (⚙ Düzenle)"); return; }
      const bad = untypeable(x.id + pass);
      if (bad.length) { close(b, "⚠ yazılamayan karakter: " + [...new Set(bad)].join(" ")); return; }
      runSteps(c, [["text", x.id], ["key", "Tab"], ["wait", 150], ["text", pass], ["key", "Enter"], ["wait", 1000], ["key", "Enter"]]);
      close(b, "✓ giriş yazıldı");
    });
    if (x.id) add("⌨ ID'yi yaz + Tab (sonra şifreyi gir)", "Oyunda ID kutusuna tıkla, sonra bunu seç: ID yazılır, imleç şifre kutusuna geçer", b => close(b, typeText(c, x.id, "tab") === x.id.length ? "✓ ID yazıldı — şifreyi gir" : "⚠ bazı karakterler yazılamadı"));
    if (x.id) add("⌨ ID'yi yaz", "Karşı PC'de imlecin olduğu kutuya hesap ID'sini yazar", b => close(b, typeText(c, x.id, false) === x.id.length ? "✓ ID yazıldı" : "⚠ bazı karakterler yazılamadı"));
    if (x.seed) add("⌨ Seed'i yaz", "Karşı PC'de imlecin olduğu kutuya (ör. OTP sitesi) seed'i yazar", b => close(b, typeText(c, x.seed, false) ? "✓ seed yazıldı" : "yazılamadı"));
    if (x.seed) add("📋 Seed'i bu bilgisayarda kopyala", "Seed'i kendi panoya kopyala" + (url ? " ve OTP sitesini aç" : ""), async b => {
      const ok = await copyText(x.seed); close(b, ok ? "✓ kopyalandı" : "kopyalanamadı");
      if (ok && url) window.open(url, "uplaj-otp");
    });
  });
  const lay = store.get("uplaj.kbd", "us");
  const k = document.createElement("div"); k.className = "hint"; k.style.paddingTop = "8px";
  k.innerHTML = `Karşı PC klavyesi: <b>${lay === "tr" ? "Türkçe Q" : "İngilizce (US)"}</b> — <a href="#" style="color:var(--acc)">değiştir</a><br>(ID'de "i" harfi "ı" çıkıyorsa değiştir)`;
  k.querySelector("a").onclick = e => { e.preventDefault(); store.set("uplaj.kbd", lay === "tr" ? "us" : "tr"); box.remove(); otpMenu(c); };
  box.appendChild(k);
  c.tile.appendChild(box);
}
document.addEventListener("mousedown", () => document.querySelectorAll(".otpmenu").forEach(x => x.remove()));

// Özel tuş kombinasyonları (Mac klavyesinde basması zor olanlar)
const COMBOS = [
  ["Alt+F4 (pencereyi / oyunu kapat)", ["AltLeft", "F4"]],
  ["Ctrl+Shift+Esc (Görev Yöneticisi)", ["ControlLeft", "ShiftLeft", "Escape"]],
  ["Ctrl+Alt+Del", ["ControlLeft", "AltLeft", "Delete"]],
  ["Alt+Tab (pencere değiştir)", ["AltLeft", "Tab"]],
  ["Win (Başlat menüsü)", [0xE3]],
  ["Win+D (masaüstünü göster)", [0xE3, "KeyD"]],
  ["Alt+Enter (tam ekran / pencere)", ["AltLeft", "Enter"]],
  ["Esc", ["Escape"]],
];
function pressCombo(c, keys){
  const us = keys.map(k => typeof k === "number" ? k : HID[k]).filter(Boolean);
  const go = () => {
    us.forEach((u, i) => setTimeout(() => c.send(0x01, u), i * 40));
    const t = us.length * 40 + 80;
    [...us].reverse().forEach((u, i) => setTimeout(() => c.send(0x02, u), t + i * 40));
  };
  if (!c.isOwner) { c.take(); setTimeout(go, 400); } else go();
}
// Metni karşı PC'ye klavyeden yazar (harf, rakam, boşluk, - _ . )
// Karakter -> basılacak tuşlar. Karşı PC'nin klavye düzenine göre (US / Türkçe Q).
const SH = 0xE1, ALTGR = 0xE6;
const KBD = {
  us: { ".": [0x37], ",": [0x36], "-": [0x2D], "_": [SH, 0x2D], "@": [SH, 0x1F], "!": [SH, 0x1E],
        "#": [SH, 0x20], "$": [SH, 0x21], "%": [SH, 0x22], "^": [SH, 0x23], "&": [SH, 0x24], "*": [SH, 0x25],
        "(": [SH, 0x26], ")": [SH, 0x27], "=": [0x2E], "+": [SH, 0x2E], "?": [SH, 0x38], "/": [0x38],
        ":": [SH, 0x33], ";": [0x33], "'": [0x34], "\"": [SH, 0x34], "<": [SH, 0x36], ">": [SH, 0x37] },
  tr: { ".": [0x38], ",": [0x31], "-": [0x2E], "_": [SH, 0x2E], "@": [ALTGR, 0x14], "!": [SH, 0x1E],
        "'": [SH, 0x1F], "^": [SH, 0x20], "+": [SH, 0x21], "%": [SH, 0x22], "&": [SH, 0x23], "/": [SH, 0x24],
        "(": [SH, 0x25], ")": [SH, 0x26], "=": [SH, 0x27], "*": [0x2D], "?": [SH, 0x2D], "#": [ALTGR, 0x20],
        "$": [ALTGR, 0x21], ":": [SH, 0x38], ";": [SH, 0x31], "\"": [0x35], "<": [0x64], ">": [SH, 0x64],
        "i": [0x34], "İ": [SH, 0x34], "ı": [0x0C], "I": [SH, 0x0C], "ş": [0x33], "Ş": [SH, 0x33], "ğ": [0x2F], "Ğ": [SH, 0x2F],
        "ü": [0x30], "Ü": [SH, 0x30], "ö": [0x36], "Ö": [SH, 0x36], "ç": [0x37], "Ç": [SH, 0x37] },
};
function charToKeys(ch){
  const map = KBD[store.get("uplaj.kbd", "us")] || KBD.us;
  if (map[ch]) return map[ch];
  if (/[a-z]/.test(ch)) return [HID["Key" + ch.toUpperCase()]];
  if (/[A-Z]/.test(ch)) return [SH, HID["Key" + ch]];
  if (/[0-9]/.test(ch)) return [HID["Digit" + ch]];
  if (ch === " ") return [HID.Space];
  return null;
}
function typeText(c, text, enter){
  const seq = [];
  for (const ch of String(text)) { const k = charToKeys(ch); if (k) seq.push(k); }
  if (!seq.length) return 0;
  const go = () => {
    let t = 0;
    seq.forEach(keys => {
      keys.forEach(u => setTimeout(() => c.send(0x01, u), t));
      t += 25;
      [...keys].reverse().forEach(u => setTimeout(() => c.send(0x02, u), t));
      t += 25;
    });
    if (enter) { const k = enter === "tab" ? HID.Tab : HID.Enter; setTimeout(() => c.send(0x01, k), t + 50); setTimeout(() => c.send(0x02, k), t + 90); }
  };
  if (!c.isOwner) { c.take(); setTimeout(go, 400); } else go();
  return seq.length;
}
// Sıralı yazma: [["text","abc"], ["key","Tab"], ["wait",1000], ...]
function runSteps(c, steps){
  const go = () => {
    let t = 0;
    for (const [kind, v] of steps) {
      if (kind === "wait") { t += v; continue; }
      const seq = kind === "key" ? [[HID[v]]] : [...String(v)].map(charToKeys).filter(Boolean);
      for (const keys of seq) {
        keys.forEach(u => setTimeout(() => c.send(0x01, u), t)); t += 30;
        [...keys].reverse().forEach(u => setTimeout(() => c.send(0x02, u), t)); t += 30;
      }
      t += 60;
    }
  };
  if (!c.isOwner) { c.take(); setTimeout(go, 400); } else go();
}
const untypeable = txt => [...String(txt)].filter(ch => !charToKeys(ch));

async function typeClipboard(c, enter){
  let txt = "";
  try { txt = await navigator.clipboard.readText(); } catch {}
  if (!txt) txt = prompt("Karşı PC'ye yazılacak metni yapıştır:") || "";
  txt = txt.trim();
  if (!txt) return;
  if (txt.length > 100) { alert("Metin çok uzun (en fazla 100 karakter)."); return; }
  const n = typeText(c, txt, enter);
  if (n !== txt.length) alert("Bazı karakterler (Türkçe harf / özel işaret) yazılamadı; sadece harf, rakam, boşluk ve - yazılır.");
}

// ---------- Makine bağlantısı
class Conn {
  constructor(m, index){
    this.m = m; this.index = index;
    this.status = {}; this.isOwner = false; this.rtts = []; this.pending = new Map(); this.seq = 1;
    this.path = ""; this.fps = 0; this.res = ""; this.closed = false;
    this.buildTile();
    this.connect();
    this.pingTimer = setInterval(() => this.ping(), 500);
    this.statsTimer = setInterval(() => this.stats(), 2000);
  }
  buildTile(){
    const t = document.createElement("div");
    t.className = "tile";
    t.innerHTML = `<video autoplay playsinline muted tabindex="0"></video>
      <div class="center">bağlanıyor…</div>
      <div class="bar"><span class="name"></span><span class="p-conn pill">…</span><span class="p-esp pill">kart</span>
        <span class="p-own pill">kontrol</span><span class="p-rtt pill">– ms</span><span class="p-path pill" title="bağlantı yolu"></span><span class="p-ver pill" title="program sürümü"></span>
        <span class="sp" style="flex:1"></span><button class="b-keys" title="Özel tuşlar: Alt+F4, Ctrl+Alt+Del, Görev Yöneticisi…">⌨</button><button class="b-otp" title="Bu makinedeki karakterin seed'ini kopyala ve OTP sitesini aç">OTP</button><button class="b-take">Kontrolü al</button><button class="b-edit" title="Düzenle">⚙</button></div>
      <div class="num"></div>`;
    this.tile = t; this.video = t.querySelector("video"); this.center = t.querySelector(".center");
    t.querySelector(".name").textContent = this.m.name;
    t.querySelector(".num").textContent = this.index + 1;
    t.querySelector(".b-take").onclick = e => { e.stopPropagation(); this.take(); };
    t.querySelector(".b-edit").onclick = e => { e.stopPropagation(); openDialog(this.m); };
    t.querySelector(".b-otp").onclick = e => { e.stopPropagation(); otpMenu(this); };
    t.querySelector(".b-keys").onclick = e => { e.stopPropagation(); keysMenu(this); };
    t.addEventListener("mousedown", e => onTileMouseDown(this, e));
    t.querySelector(".bar").addEventListener("click", e => { if (!e.target.closest("button") && active !== this) setActive(this); });
    t.addEventListener("dblclick", e => { if (!capture) { e.preventDefault(); setActive(this); toggleSolo(true); } });
    $("grid").appendChild(t);
  }
  pill(cls, text, state){ const el = this.tile.querySelector("."+cls); el.textContent = text; el.className = cls + " pill " + (state||""); }

  connect(){
    if (this.closed) return;
    let u = this.m.url.trim().replace(/\/+$/, "");
    if (!/^https?:\/\//.test(u)) u = (/^[\d.]+(:\d+)?$/.test(u) ? "http://" : "https://") + u;
    // https sayfadan http alan adına bağlanılamaz; alan adıysa https'e çevir
    if (location.protocol === "https:" && u.startsWith("http://") && !/^http:\/\/[\d.]+(:\d+)?$/.test(u)) u = "https://" + u.slice(7);
    this.m.url = u;
    const base = u.replace(/^http/, "ws");
    let ws;
    try { ws = new WebSocket(`${base}/ws?token=${encodeURIComponent(this.m.token)}&user=${encodeURIComponent(me())}`); }
    catch (e) { this.pill("p-conn", "adres hatalı", "bad"); return; }
    this.ws = ws; ws.binaryType = "arraybuffer";
    this.pill("p-conn", "bağlanıyor", "warn");
    ws.onopen = () => { this.pill("p-conn", "bağlı", "ok"); this.center.textContent = "görüntü bekleniyor…"; if (liteMode) this.sendJSON({ type: "lite", on: true }); };
    ws.onclose = () => {
      if (this.ws !== ws) return;
      this.pill("p-conn", "bağlı değil", "bad"); this.isOwner = false; this.updateOwner();
      this.center.style.display = ""; this.center.textContent = "bağlantı yok — yeniden deneniyor (adres / erişim kodu / program açık mı?)";
      this.closePC();
      clearTimeout(this.retry); this.retry = setTimeout(() => this.connect(), 2500);
    };
    ws.onmessage = ev => typeof ev.data === "string" ? this.onJSON(JSON.parse(ev.data)) : this.onBinary(new Uint8Array(ev.data));
  }
  reconnect(){ clearTimeout(this.retry); if (this.ws) { const w = this.ws; this.ws = null; w.close(); } this.closePC(); this.connect(); }
  close(){ this.closed = true; clearInterval(this.pingTimer); clearInterval(this.statsTimer); clearTimeout(this.retry); if (this.ws) { const w=this.ws; this.ws=null; w.close(); } this.closePC(); this.tile.remove(); }
  closePC(){ if (this.pc) { this.pc.close(); this.pc = null; this.dc = null; } }

  async onJSON(s){
    if (s.type === "hello") { this.ice = s.ice || []; if (!this.paused) this.startWebRTC(this.ice); }
    else if (s.type === "answer") { try { await this.pc.setRemoteDescription({type:"answer", sdp:s.sdp}); } catch (e) { console.warn(e); } }
    else if (s.type === "status") {
      this.status = s;
      if (!this.updating) this.pill("p-ver", "v" + s.version);
      autoUpdate();
      if (s.espState) this.pill("p-esp", "kart: " + s.espState, "warn");
      else if (s.espPort === "windows") this.pill("p-esp", "Windows girişi ✓", "ok");
      else this.pill("p-esp", s.esp ? "kart ✓" : "kart takılı değil", s.esp ? "ok" : "bad");
      this.isOwner = s.owner === me();
      this.ownerName = s.owner;
      this.updateOwner();
      if (!s.video) { this.center.style.display = ""; this.center.textContent = "Bu makinede ffmpeg yok — görüntü gelmez, klavye/fare çalışır."; }
    }
  }
  updateOwner(){
    const o = this.ownerName;
    this.pill("p-own", o ? (this.isOwner ? "kontrol: sen" : "kontrol: " + o) : "kontrol: boşta", this.isOwner ? "ok" : o ? "warn" : "");
    this.tile.querySelector(".b-take").style.display = this.isOwner ? "none" : "";
  }
  onBinary(d){
    if ((d[0] === 0x90 || d[0] === 0x9F) && d.length >= 5) {
      const id = (d[1] | d[2]<<8 | d[3]<<16 | d[4]<<24) >>> 0;
      const t0 = this.pending.get(id); if (t0 === undefined) return;
      this.pending.delete(id);
      if (d[0] === 0x9F) return;
      const ms = performance.now() - t0;
      this.rtts.push(ms); if (this.rtts.length > 20) this.rtts.shift();
      const avg = this.rtts.reduce((a,b)=>a+b,0) / this.rtts.length;
      this.pill("p-rtt", avg.toFixed(0) + " ms", avg < 30 ? "ok" : avg < 70 ? "warn" : "bad");
      if (this.tabMs) { this.tabMs.textContent = avg.toFixed(0) + " ms"; this.tabMs.className = "ms " + (avg < 30 ? "ok" : avg < 70 ? "warn" : "bad"); }
    }
  }

  async startWebRTC(iceServers){
    this.closePC();
    const pc = new RTCPeerConnection({ iceServers });
    this.pc = pc;
    pc.addTransceiver("video", { direction: "recvonly" });
    const dc = pc.createDataChannel("input", { ordered: true });
    dc.binaryType = "arraybuffer";
    dc.onopen = () => { if (this.pc === pc) this.dc = dc; };
    dc.onmessage = ev => this.onBinary(new Uint8Array(ev.data));
    pc.ontrack = ev => {
      try { ev.receiver.jitterBufferTarget = 0; } catch {}
      try { ev.receiver.playoutDelayHint = 0; } catch {}
      this.video.srcObject = ev.streams[0] || new MediaStream([ev.track]);
      this.video.onloadeddata = () => { this.center.style.display = "none"; };
    };
    pc.onconnectionstatechange = () => {
      if (pc.connectionState === "failed") {
        this.center.style.display = ""; this.center.textContent = "görüntü bağlantısı kurulamadı (ağ engelliyor olabilir — TURN gerekli). Klavye/fare yine çalışır.";
        this.pill("p-path", "yol yok", "bad");
      }
    };
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await new Promise(res => {
      if (pc.iceGatheringState === "complete") return res();
      const t = setTimeout(res, 2500);
      pc.addEventListener("icegatheringstatechange", () => { if (pc.iceGatheringState === "complete") { clearTimeout(t); res(); } });
    });
    if (this.pc !== pc || !this.ws || this.ws.readyState !== 1) return;
    this.ws.send(JSON.stringify({ type: "offer", sdp: pc.localDescription.sdp }));
    if (active === this) this.sendJSON({ type: "focus", on: true });
  }

  sendJSON(o){ if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(o)); }
  sendRaw(bytes){
    const b = new Uint8Array(bytes);
    if (this.dc && this.dc.readyState === "open") this.dc.send(b);
    else if (this.ws && this.ws.readyState === 1) this.ws.send(b);
  }
  send(...bytes){ if (this.isOwner) this.sendRaw(bytes); }
  take(){ this.sendJSON({ type: "take" }); }
  release(){ this.sendJSON({ type: "release" }); }
  ping(){
    if (!this.ws || this.ws.readyState !== 1) return;
    // WebSocket'i canlı tut (pingler veri kanalından gidince ws sessiz kalıyor)
    if ((this.kaTick = (this.kaTick || 0) + 1) % 6 === 0) this.sendJSON({ type: "keepalive" });
    for (const [id, t] of this.pending) if (performance.now() - t > 3000) this.pending.delete(id);
    const id = this.seq++ >>> 0;
    this.pending.set(id, performance.now());
    this.sendRaw([0x10, id & 0xFF, (id>>8)&0xFF, (id>>16)&0xFF, (id>>>24)&0xFF]);
  }
  async stats(){
    if (!this.pc) return;
    try {
      const st = await this.pc.getStats(); let pair, local, remote, inb;
      st.forEach(r => { if (r.type === "transport" && r.selectedCandidatePairId) pair = st.get(r.selectedCandidatePairId); });
      if (!pair) st.forEach(r => { if (r.type === "candidate-pair" && r.nominated && r.state === "succeeded") pair = r; });
      st.forEach(r => { if (r.type === "inbound-rtp" && r.kind === "video") inb = r; });
      if (pair) { local = st.get(pair.localCandidateId); remote = st.get(pair.remoteCandidateId); }
      if (local && remote) {
        const relay = local.candidateType === "relay" || remote.candidateType === "relay";
        const host = local.candidateType === "host" && remote.candidateType === "host";
        this.pill("p-path", relay ? "TURN" : host ? "yerel ağ" : "doğrudan", relay ? "warn" : "ok");
      }
      if (inb) {
        // Donma bekçisi: 6 sn boyunca yeni kare gelmezse görüntü bağlantısını yenile
        const fd = inb.framesDecoded || 0;
        if (fd !== this.lastFrames) { this.lastFrames = fd; this.frozenSince = 0; }
        else if (!this.paused && !this.off && !document.hidden) {
          this.frozenSince = this.frozenSince || performance.now();
          if (performance.now() - this.frozenSince > 6000 && performance.now() - (this.healedAt || 0) > 15000) {
            this.healedAt = performance.now(); this.frozenSince = 0;
            console.log(this.m.name + ": görüntü dondu, yenileniyor");
            this.startWebRTC(this.ice || []);
            return;
          }
        }
        const fps = inb.framesPerSecond || 0, w = inb.frameWidth, h = inb.frameHeight;
        this.pill("p-path", (this.tile.querySelector(".p-path").textContent.split(" ·")[0] || "") + (w ? ` · ${w}×${h} ${fps|0}fps` : ""), this.tile.querySelector(".p-path").className.split(" ").pop());
      }
    } catch {}
  }
}

// ---------- Seçim, büyütme, kontrol
let conns = [];
let active = null, capture = false, swallow = false;
const held = new Set();

function rebuild(){
  conns.forEach(c => c.close());
  $("grid").innerHTML = "";
  if (!machines.length) {
    $("grid").innerHTML = `<div id="empty"><h3>Henüz makine yok</h3>Sağ üstteki <b>+ Makine</b> ile oyun PC'lerini ekle.
      Her PC'nin adresi ve erişim kodu, o PC'de açık olan uplaj-agent penceresinde yazar.<br><br>
      Liste kodun varsa <b>Liste</b>'ye basıp yapıştır, bütün makineler tek seferde eklenir.</div>`;
  }
  conns = machines.map((m, i) => new Conn(m, i));
  active = null; capture = false;
  if (conns.length) setActive(conns[0], false);
  applyLayout();
}

function setActive(c, focusVideo = true){
  if (active === c) return;
  if (active) { releaseKeys(); active.tile.classList.remove("active", "capture"); active.sendJSON({ type: "focus", on: false }); }
  stopCapture();
  active = c;
  if (!c) return;
  c.tile.classList.add("active");
  if (document.body.classList.contains("solo") || document.body.classList.contains("tabs")) applyLayout();
  c.sendJSON({ type: "focus", on: true });
  if (focusVideo) c.video.focus();
}

// ---------- Düzen: 1/2/4/6/8/9'lu, ekrana sığdır. Fazlası sonraki sayfada.
// Ekranda olmayan makinelerin görüntüsü durdurulur (kota harcamasın).
const LAYOUTS = { 1:[1,1], 2:[2,1], 4:[2,2], 6:[3,2], 8:[4,2], 9:[3,3] };
let page = 0;
$("layout").value = store.get("uplaj.layout", "auto");
function buildTabs(){
  const bar = $("tabbar"); bar.innerHTML = "";
  conns.forEach((c, i) => {
    const b = document.createElement("button");
    b.innerHTML = `<b></b><span class="ms">– ms</span>`; b.title = "Ctrl+Alt+" + (i + 1);
    b.querySelector("b").textContent = c.m.name;
    c.tabBtn = b; c.tabMs = b.querySelector(".ms");
    b.onclick = () => { setActive(c); };
    bar.appendChild(b);
  });
}
function applyLayout(){
  const v = $("layout").value, L = LAYOUTS[v];
  const tabs = v === "tabs";
  document.body.classList.toggle("tabs", tabs);
  if (tabs && document.body.classList.contains("solo")) { document.body.classList.remove("solo"); $("solo").textContent = "Büyüt"; }
  if (tabs && (!conns[0] || !conns[0].tabBtn || conns[0].tabBtn.parentNode !== $("tabbar"))) buildTabs();
  conns.forEach(c => c.tabBtn && c.tabBtn.classList.toggle("on", c === active));
  const solo = document.body.classList.contains("solo");
  document.body.classList.toggle("fixed", !!L);
  let per = conns.length;
  if (L) {
    let [cols, rows] = L;
    if (innerHeight > innerWidth && cols > rows) [cols, rows] = [rows, cols]; // dik ekranda çevir
    $("grid").style.setProperty("--cols", cols); $("grid").style.setProperty("--rows", rows);
    per = cols * rows;
  }
  const pages = Math.max(1, Math.ceil(conns.length / per));
  page = Math.min(page, pages - 1);
  $("pager").classList.toggle("many", pages > 1);
  $("pgText").textContent = `${page + 1}/${pages}`;
  // Büyüt modu: sağdaki küçükler hep aynı sırada; büyüyen makinenin yerinde boş kutu kalır
  let slot = $("grid").querySelector(".slot");
  if (!slot) { slot = document.createElement("div"); slot.className = "slot"; $("grid").appendChild(slot); }
  $("grid").style.setProperty("--srows", Math.max(1, conns.length));
  conns.forEach((c, i) => {
    if (solo && c === active) { c.tile.style.gridColumn = "1"; c.tile.style.gridRow = `1 / span ${Math.max(1, conns.length)}`; }
    else if (solo) { c.tile.style.gridColumn = "2"; c.tile.style.gridRow = String(i + 1); }
    else { c.tile.style.gridColumn = ""; c.tile.style.gridRow = ""; }
  });
  if (solo && active) { slot.style.gridColumn = "2"; slot.style.gridRow = String(conns.indexOf(active) + 1); slot.textContent = active.m.name + " büyükte"; }
  conns.forEach((c, i) => {
    const off = !solo && !!L && Math.floor(i / per) !== page;
    c.tile.classList.toggle("off", off);
    if (off && !c.off) { c.off = true; c.sendJSON({ type: "pause" }); c.closePC(); c.paused = true; }
    else if (!off && c.off) { c.off = false; if (c.paused && !idlePaused && !document.hidden) { c.paused = false; c.reconnect(); } }
  });
}
function showConn(c){ // Ctrl+Alt+n ile başka sayfadaki makineye geçince o sayfaya git
  const L = LAYOUTS[$("layout").value]; if (!L) return;
  const np = Math.floor(conns.indexOf(c) / (L[0] * L[1]));
  if (np !== page) { page = np; applyLayout(); }
}
$("layout").onchange = () => { store.set("uplaj.layout", $("layout").value); page = 0; applyLayout(); };
$("pgPrev").onclick = () => { page = Math.max(0, page - 1); applyLayout(); };
$("pgNext").onclick = () => { page++; applyLayout(); };
addEventListener("resize", () => { if (LAYOUTS[$("layout").value]) applyLayout(); });

function toggleSolo(force){
  const on = force === undefined ? !document.body.classList.contains("solo") : force;
  document.body.classList.toggle("solo", on);
  $("solo").textContent = on ? "Grid" : "Büyüt";
  applyLayout();
}
$("solo").onclick = () => toggleSolo();

function startCapture(){
  if (!active) return;
  capture = true;
  active.tile.classList.add("capture");
  active.tile.classList.toggle("showcursor", $("mode").value === "abs");
  active.video.focus();
  if ($("mode").value === "rel" && !document.pointerLockElement) {
    active.video.requestPointerLock({ unadjustedMovement: true }).catch(() => active.video.requestPointerLock());
  }
}
function stopCapture(){
  if (capture) releaseKeys();
  capture = false;
  conns.forEach(c => c.tile.classList.remove("capture"));
  if (document.pointerLockElement) document.exitPointerLock();
}
function releaseKeys(){ held.clear(); if (active) active.send(0x07); }

function onTileMouseDown(c, e){
  if (e.target.closest("button")) return;
  // seçme/başlatma tıklaması oyuna tıklama olarak gitmesin
  if (active !== c) { swallow = true; setActive(c); e.preventDefault(); if (!c.ownerName) c.take(); startCapture(); return; }
  if (!capture) { swallow = true; e.preventDefault(); if (!c.ownerName) c.take(); startCapture(); return; }
}

document.addEventListener("pointerlockchange", () => { if (!document.pointerLockElement && $("mode").value === "rel") stopCapture(); });
window.addEventListener("blur", stopCapture);
// Sekme 20 sn gizli kalırsa görüntüyü durdur (TURN kotası harcanmasın), geri gelince devam et
let hideTimer = null;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    stopCapture();
    // Görüntüyü KESME (geri dönünce bağlantı baştan kurulup ekranlar kararıyordu);
    // 20 sn sonra izleme moduna (2 kare/sn, küçük) geç: kota az gider, dönünce anında görünür.
    hideTimer = setTimeout(() => { if (!liteMode) setLite(true); }, 20000);
  } else {
    clearTimeout(hideTimer);
    lastActivity = Date.now();
    if (liteMode) setLite(false);
    conns.forEach(c => { if (c.paused && !c.off) { c.paused = false; c.reconnect(); } });
  }
});
// Kimse kullanmıyorsa 10 dk sonra İZLEME MODU: görüntü durmaz, saniyede 2 kare
// küçük görüntüye geçer (DC kontrolü için yeterli, çok az kota). Hareket edince normale döner.
const IDLE_MS = 10 * 60 * 1000;
let lastActivity = Date.now(), idlePaused = false, liteMode = false;
const liteBar = document.createElement("div");
liteBar.style.cssText = "position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:none;background:#f5a524;color:#000;font-weight:600;padding:5px 12px;border-radius:999px;z-index:50;font-size:12px;pointer-events:none";
liteBar.textContent = "İzleme modu: saniyede 2 kare, 720p (kota tasarrufu) — fareyi oynatınca normale döner";
document.body.appendChild(liteBar);
function setLite(on){
  liteMode = on; liteBar.style.display = on ? "" : "none";
  conns.forEach(c => c.sendJSON({ type: "lite", on }));
}
function activity(){
  lastActivity = Date.now();
  if (liteMode) setLite(false);
}
["mousemove", "mousedown", "keydown", "wheel", "touchstart"].forEach(t => document.addEventListener(t, activity, { passive: true, capture: true }));
setInterval(() => {
  if (liteMode || capture || Date.now() - lastActivity < IDLE_MS) return;
  setLite(true);
}, 15000);
document.addEventListener("contextmenu", e => { if (e.target.closest(".tile")) e.preventDefault(); });
document.addEventListener("mousedown", e => { if (capture && !e.target.closest(".tile")) stopCapture(); });

// Fare
function videoPoint(c, e){
  const v = c.video, r = v.getBoundingClientRect();
  const vw = v.videoWidth || 16, vh = v.videoHeight || 9;
  const s = Math.min(r.width / vw, r.height / vh);
  const w = vw * s, h = vh * s, ox = r.left + (r.width - w) / 2, oy = r.top + (r.height - h) / 2;
  return [Math.min(1, Math.max(0, (e.clientX - ox) / w)), Math.min(1, Math.max(0, (e.clientY - oy) / h))];
}
document.addEventListener("mousemove", e => {
  if (!capture || !active) return;
  if ($("mode").value !== "rel" && onPanelUI(e)) return;
  if ($("mode").value === "rel") {
    if (e.movementX || e.movementY) active.send(0x04, ...u16(e.movementX), ...u16(e.movementY));
  } else if (e.target.closest(".tile") === active.tile) {
    const [x, y] = videoPoint(active, e);
    active.send(0x03, ...u16(Math.round(x * 32767)), ...u16(Math.round(y * 32767)));
  }
});
// Panelin kendi düğmeleri/menüleri (OTP, ⌨, ⚙ …) karşı PC'ye tıklama olarak gitmesin
const onPanelUI = e => !!(e.target.closest && e.target.closest(".bar, .otpmenu, button, dialog"));
const btn = e => { if (swallow) { if (e.type === "mouseup") swallow = false; return; } if (!capture || !active) return; if (onPanelUI(e)) return; if ($("mode").value === "abs" && e.target.closest(".tile") !== active.tile) return; e.preventDefault(); active.send(0x05, e.buttons & 0x1F); };
document.addEventListener("mousedown", btn);
document.addEventListener("mouseup", btn);
let wheelAcc = 0;
document.addEventListener("wheel", e => {
  if (!capture || !active) return;
  e.preventDefault();
  wheelAcc += e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY;
  while (Math.abs(wheelAcc) >= 100) { const s = wheelAcc > 0 ? -1 : 1; active.send(0x06, s & 0xFF); wheelAcc += s * 100; }
}, { passive: false });

// Klavye
function usageOf(e){
  if (e.code === "MetaLeft" || e.code === "MetaRight") return $("cmdctrl").checked ? 0xE0 : 0;
  return HID[e.code] || 0;
}
document.addEventListener("keydown", e => {
  // Kısayollar: Ctrl+Alt+1..9 makine seç, Ctrl+Alt+0 kontrolü bırak
  if (e.ctrlKey && e.altKey && /^Digit\d$/.test(e.code)) {
    e.preventDefault();
    const n = +e.code.slice(5);
    if (n === 0) { stopCapture(); return; }
    const c = conns[n - 1];
    if (c) { showConn(c); setActive(c); if (!c.ownerName) c.take(); startCapture(); }
    return;
  }
  if (!capture || !active) return;
  // Ctrl+V / Cmd+V: BU bilgisayarda kopyalanan metni (ör. OTP kodu) oyuna yazar
  if ((e.ctrlKey || e.metaKey) && e.code === "KeyV" && !e.altKey) {
    for (const h of [...held]) { held.delete(h); active.send(0x02, h); } // basılı Ctrl/Cmd'yi karşıda bırak
    pasteArmed = active;
    clearTimeout(pasteTimer);
    pasteTimer = setTimeout(() => { if (pasteArmed) { const c = pasteArmed; pasteArmed = null; navigator.clipboard.readText().then(t => pasteToRemote(c, t)).catch(() => {}); } }, 250);
    return; // preventDefault yok: tarayıcı "paste" olayını üretsin
  }
  e.preventDefault();
  const u = usageOf(e); if (!u || held.has(u)) return;
  held.add(u); active.send(0x01, u);
});
let pasteArmed = null, pasteTimer = null;
function pasteToRemote(c, txt){
  txt = String(txt || "").trim();
  if (!c || !txt) return;
  if (txt.length > 64) { flash(c, "pano çok uzun, yazılmadı"); return; }
  const bad = untypeable(txt);
  if (bad.length) { flash(c, "yazılamayan karakter: " + [...new Set(bad)].join(" ")); return; }
  // Sadece rakamsa (OTP kodu) yazdıktan sonra Enter'a da bas
  const otp = /^\d{4,8}$/.test(txt);
  runSteps(c, otp ? [["text", txt], ["key", "Enter"]] : [["text", txt]]);
  flash(c, (otp ? "✓ OTP girildi: " : "✓ yapıştırıldı: ") + (txt.length > 12 ? txt.slice(0, 12) + "…" : txt));
}
function flash(c, msg){
  const d = document.createElement("div");
  d.textContent = msg;
  d.style.cssText = "position:absolute;left:50%;top:40px;transform:translateX(-50%);background:#000c;color:#fff;padding:6px 12px;border-radius:8px;z-index:6;pointer-events:none;font-size:13px";
  c.tile.appendChild(d); setTimeout(() => d.remove(), 1800);
}
document.addEventListener("paste", e => {
  if (!capture || !active || !pasteArmed) return;
  e.preventDefault();
  const c = pasteArmed; pasteArmed = null; clearTimeout(pasteTimer);
  pasteToRemote(c, e.clipboardData && e.clipboardData.getData("text"));
});
document.addEventListener("keyup", e => {
  if (!capture || !active) return;
  e.preventDefault();
  if (e.code === "MetaLeft" || e.code === "MetaRight") {
    for (const h of [...held]) if (h < 0xE0) { held.delete(h); active.send(0x02, h); }
  }
  const u = usageOf(e); if (!u) return;
  held.delete(u); active.send(0x02, u);
});

// ---------- Üst butonlar
$("takeAll").onclick = () => conns.forEach(c => c.take());
$("releaseAll").onclick = () => { stopCapture(); conns.forEach(c => c.release()); };
$("share").onclick = () => {
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(machines.map(({name,url,token,otp}) => ({name,url,token,otp: otp || "", otpUrl: store.get("uplaj.otpUrl", "")}))))));
  const input = prompt("Bu kodu ortağına gönder. Ortağın kendi panelinde 'Liste'ye basıp bu kutuya yapıştırınca bütün makineler eklenir.\n\nBaşkasından kod aldıysan buraya yapıştırıp Tamam'a bas:", code);
  if (!input || input === code) return;
  try {
    const list = JSON.parse(decodeURIComponent(escape(atob(input.trim()))));
    if (!Array.isArray(list)) throw 0;
    machines = list.map((m, i) => ({ id: Date.now() + i, name: String(m.name), url: String(m.url), token: String(m.token), otp: String(m.otp || "") }));
    const ou = list.map(m => m.otpUrl).find(Boolean); if (ou) store.set("uplaj.otpUrl", String(ou));
    saveMachines(); rebuild();
  } catch { alert("Kod okunamadı."); }
};

// ---------- Makine ekle / düzenle
let editing = null;
function openDialog(m){
  stopCapture();
  editing = m || null;
  $("dlgTitle").textContent = m ? "Makineyi düzenle" : "Makine ekle";
  $("fName").value = m ? m.name : "kvm" + (machines.length + 1);
  const onAgent = location.protocol.startsWith("http") && !location.hostname.endsWith("github.io");
  $("fUrl").value = m ? m.url : (machines.length || !onAgent ? "" : location.origin);
  $("fToken").value = m ? m.token : "";
  $("fChars").innerHTML = `<div class="charhead"><span>Karakter adı</span><span>Hesap ID (giriş adı)</span><span>OTP seed</span><span></span></div>`;
  const rows = m ? parseOtp(m.otp) : [];
  (rows.length ? rows : [{ name: "", id: "", seed: "" }]).forEach(addCharRow);
  $("fOtpUrl").value = store.get("uplaj.otpUrl", "");
  $("fPass").value = store.get("uplaj.pass", ""); $("fPass").type = "password"; $("fPassShow").textContent = "Göster";
  $("fDel").style.display = m ? "" : "none";
  $("dlg").showModal();
}
function addCharRow(x){
  const r = document.createElement("div"); r.className = "charrow";
  r.innerHTML = `<input class="cName" placeholder="Okcu"><input class="cId" placeholder="hesabim123" autocomplete="off"><input class="cSeed" placeholder="5dbe…" autocomplete="off"><button type="button" title="Sil">×</button>`;
  r.querySelector(".cName").value = x.name || ""; r.querySelector(".cId").value = x.id || ""; r.querySelector(".cSeed").value = x.seed || "";
  r.querySelector("button").onclick = () => r.remove();
  $("fChars").appendChild(r);
}
$("fAddChar").onclick = () => addCharRow({});
$("fPassShow").onclick = () => { const p = $("fPass"); p.type = p.type === "password" ? "text" : "password"; $("fPassShow").textContent = p.type === "password" ? "Göster" : "Gizle"; };
const charsText = () => [...$("fChars").querySelectorAll(".charrow")].map(r => {
  const v = cls => r.querySelector(cls).value.replace(/[|\n]/g, " ").trim();
  const name = v(".cName"), id = v(".cId"), seed = v(".cSeed").replace(/\s+/g, "");
  return (id || seed) ? `${name || "karakter"} | ${id} | ${seed}` : "";
}).filter(Boolean).join("\n");
$("add").onclick = () => openDialog(null);
$("fCancel").onclick = () => $("dlg").close();
$("fDel").onclick = () => { if (editing && confirm(editing.name + " silinsin mi?")) { machines = machines.filter(x => x !== editing); saveMachines(); $("dlg").close(); rebuild(); } };
$("fSave").onclick = () => {
  let url = $("fUrl").value.trim();
  url = url.replace(/^(wss?|https?):?\/*/i, m => m.toLowerCase().startsWith("ws") ? "http" + m.slice(2).replace(/:?\/*$/, "://") : m.replace(/:?\/*$/, "://")).replace(/\/+$/, "");
  // alan adı (ko1.hemenrandevum.com gibi) -> https, IP adresi -> http
  if (url && !/^https?:\/\//.test(url)) url = (/^[\d.]+(:\d+)?$/.test(url) ? "http://" : "https://") + url;
  if (/^http:\/\/[\d.]+$/.test(url)) url += ":8780";
  const m = { id: editing ? editing.id : Date.now(), name: $("fName").value.trim() || "makine", url, token: $("fToken").value.trim(), otp: charsText() };
  let ou = $("fOtpUrl").value.trim(); if (ou && !/^https?:\/\//.test(ou)) ou = "https://" + ou;
  store.set("uplaj.otpUrl", ou);
  store.set("uplaj.pass", $("fPass").value);
  if (!m.url || !m.token) { alert("Adres ve erişim kodu gerekli."); return; }
  if (location.protocol === "https:" && m.url.startsWith("http:")) alert("Uyarı: Bu panel https ile açık; http:// adreslere tarayıcı izin vermez. Paneli http:// adresten aç ya da makineye https adresi ver.");
  machines = editing ? machines.map(x => x === editing ? m : x) : [...machines, m];
  saveMachines(); $("dlg").close(); rebuild();
};

// ---------- Güncelleme
// Bir makinede daha yeni sürüm varsa, eski olanlar onu kendisi çeker (otomatik).
const verNewer = (a, b) => { const x = String(a).split(".").map(Number), y = String(b).split(".").map(Number);
  for (let i = 0; i < Math.max(x.length, y.length); i++) { if ((x[i]||0) !== (y[i]||0)) return (x[i]||0) > (y[i]||0); } return false; };
const apiBase = m => m.url.replace(/\/+$/, "");
const triedPull = new Set();
async function updateCall(c, path, body){
  c.updating = true; c.pill("p-ver", "güncelleniyor…", "warn");
  try {
    const r = await fetch(apiBase(c.m) + path, { method: "POST", headers: { "X-Uplaj-Token": c.m.token, "Content-Type": "application/octet-stream" }, body });
    const t = await r.text();
    if (!r.ok) throw new Error(t.trim());
    const j = JSON.parse(t);
    c.pill("p-ver", "v" + j.to + " — yeniden başlıyor", "ok");
    setTimeout(() => { c.updating = false; }, 20000);
  } catch (e) {
    c.updating = false;
    c.pill("p-ver", "güncellenemedi", "bad");
    c.tile.querySelector(".p-ver").title = String(e.message || e);
  }
}
function autoUpdate(){
  const live = conns.filter(c => c.status.version && c.ws && c.ws.readyState === 1);
  if (live.length < 2) return;
  const src = live.reduce((a, b) => verNewer(b.status.version, a.status.version) ? b : a);
  for (const c of live) {
    if (c === src || c.updating || !verNewer(src.status.version, c.status.version)) continue;
    if (!verNewer(c.status.version, "0.3.9")) continue; // 0.3.x güncellemeyi bilmez, elle kopyalanmalı
    const key = c.m.id + ">" + src.status.version;
    if (triedPull.has(key)) continue;
    triedPull.add(key);
    updateCall(c, `/update/pull?from=${encodeURIComponent(apiBase(src.m))}&fromToken=${encodeURIComponent(src.m.token)}`, null);
  }
}
$("upd").onclick = e => {
  stopCapture();
  if (e.shiftKey) { $("updFile").value = ""; $("updFile").click(); return; }
  const live = conns.filter(c => c.status.version && c.ws && c.ws.readyState === 1);
  if (!live.length) { alert("Bağlı makine yok."); return; }
  const old = live.filter(c => !verNewer(c.status.version, "0.4.1"));
  if (old.length) alert(old.map(c => c.m.name).join(", ") + " bu butonu bilmiyor; programı kapatıp açman yeterli, açılışta kendisi güncellenir.");
  const ok = live.filter(c => !old.includes(c));
  if (!ok.length) return;
  if (!confirm("İnternetteki son sürüm şu makinelere kurulsun mu?\n" + ok.map(c => c.m.name + " (v" + c.status.version + ")").join("\n") + "\n\nGüncel olanlar dokunulmadan kalır.")) return;
  ok.forEach(async c => {
    c.updating = true; c.pill("p-ver", "kontrol ediliyor…", "warn");
    try {
      const r = await fetch(apiBase(c.m) + "/update/online", { method: "POST", headers: { "X-Uplaj-Token": c.m.token } });
      const t = (await r.text()).trim();
      if (r.ok) { c.pill("p-ver", "v" + JSON.parse(t).to + " — yeniden başlıyor", "ok"); setTimeout(() => { c.updating = false; }, 20000); }
      else { c.updating = false; c.pill("p-ver", t.startsWith("zaten güncel") ? "v" + c.status.version + " ✓ güncel" : "güncellenemedi", t.startsWith("zaten güncel") ? "ok" : "bad"); c.tile.querySelector(".p-ver").title = t; }
    } catch (err) { c.updating = false; c.pill("p-ver", "güncellenemedi", "bad"); c.tile.querySelector(".p-ver").title = String(err); }
  });
};
$("updFile").onchange = async () => {
  const f = $("updFile").files[0]; if (!f) return;
  const buf = new Uint8Array(await f.arrayBuffer());
  const txt = new TextDecoder("latin1").decode(buf);
  const m = /UPLAJVER:(\d+\.\d+\.\d+);/.exec(txt);
  if (!m) { alert("Bu dosya uplaj-agent.exe değil."); return; }
  const v = m[1];
  const targets = conns.filter(c => c.status.version && verNewer(v, c.status.version));
  const old = targets.filter(c => !verNewer(c.status.version, "0.3.9"));
  if (old.length) alert(old.map(c => c.m.name).join(", ") + " eski sürümde (0.3), bunlara exe'yi bir kez elle kopyalaman lazım. Sonrakiler otomatik.");
  const ok = targets.filter(c => !old.includes(c));
  if (!ok.length) { if (!old.length) alert("Bağlı makinelerin hepsi zaten v" + v + " veya daha yeni."); return; }
  if (!confirm(`v${v} şu makinelere yüklensin mi?\n${ok.map(c => c.m.name + " (v" + c.status.version + ")").join("\n")}\n\nProgram kendini yeniden başlatır (birkaç saniye).`)) return;
  ok.forEach(c => updateCall(c, "/update/upload", buf));
};

// İlk açılış: panel bir ajandan açıldıysa ve liste boşsa, bu makineyi önermek için pencereyi aç
rebuild();
if (!machines.length && location.protocol.startsWith("http") && !location.hostname.endsWith("github.io")) openDialog(null);
</script>
